name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Fresh Android Scaffolding (v2 Embedding)
        run: |
          mkdir /tmp/scaffold
          cd /tmp/scaffold
          flutter create dummy_app --org com.fmcg.tally --platforms=android
          cp -r dummy_app/android $GITHUB_WORKSPACE/

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fmcg-app-apk
          path: build/app/outputs/flutter-apk/*.apk
